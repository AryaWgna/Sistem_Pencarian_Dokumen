<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk / Daftar - E-Arsip SLB</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

    {# Flash messages ditampilkan via SweetAlert2 #}

    <div class="container-auth {{ 'right-panel-active' if is_register else '' }}" id="container">
        <!-- Form Pendaftaran -->
        <div class="form-container sign-up-container">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <h2 class="fw-bold text-primary mb-4">Buat Akun</h2>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="nama" class="form-control bg-light" placeholder="Nama Lengkap">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-light"><i class="bi bi-at"></i></span>
                    <input type="text" name="username" class="form-control bg-light" placeholder="Username">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-light toggle-pwd" placeholder="Password">
                    <span class="input-group-text bg-light toggle-eye" style="cursor: pointer;"><i class="bi bi-eye-slash"></i></span>
                </div>
                <div class="input-group mb-4">
                    <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" name="confirm_password" class="form-control bg-light toggle-pwd" placeholder="Konfirmasi Password">
                    <span class="input-group-text bg-light toggle-eye" style="cursor: pointer;"><i class="bi bi-eye-slash"></i></span>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill shadow-sm">Daftar Sekarang</button>
            </form>
        </div>

        <!-- Form Login -->
        <div class="form-container sign-in-container">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-4 text-center">
                    <i class="bi bi-archive-fill text-primary display-4"></i>
                </div>
                <h2 class="fw-bold text-primary mb-4">Masuk Sistem</h2>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-light" placeholder="Username">
                </div>
                <div class="input-group mb-4">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-light toggle-pwd" placeholder="Password">
                    <span class="input-group-text bg-light toggle-eye" style="cursor: pointer;"><i class="bi bi-eye-slash"></i></span>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill shadow-sm">Masuk</button>
            </form>
        </div>

        <!-- Panel Overlay Animasi -->
        <div class="overlay-container shadow">
            <div class="overlay bg-primary text-white">
                <div class="overlay-panel overlay-left">
                    <h2 class="fw-bold mb-3">Sudah punya akun?</h2>
                    <p>Silakan masuk menggunakan akun Anda yang telah terdaftar untuk mengakses dokumen.</p>
                    <button class="btn btn-outline-light rounded-pill px-5 fw-bold mt-3" type="button" id="signIn">Masuk</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h2 class="fw-bold mb-3">E-Arsip SLB</h2>
                    <p>Sistem Pencarian Dokumen Digital Terintegrasi dengan Kecerdasan Buatan.</p>
                    <button class="btn btn-outline-light rounded-pill px-5 fw-bold mt-3" type="button" id="signUp">Daftar Baru</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
            // Change URL without reloading
            window.history.pushState({}, '', '{{ url_for("auth.register") }}');
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
            window.history.pushState({}, '', '{{ url_for("auth.login") }}');
        });

        // Toggle Password Visibility
        const toggleEyes = document.querySelectorAll('.toggle-eye');
        toggleEyes.forEach(eye => {
            eye.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                } else {
                    input.type = 'password';
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                }
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            {% if category == 'success' %}
            Swal.fire({ icon: 'success', title: 'Berhasil!', text: '{{ message }}', confirmButtonColor: '#198754', timer: 2500, timerProgressBar: true });
            {% elif category == 'danger' %}
            Swal.fire({ icon: 'error', title: 'Gagal!', text: '{{ message }}', confirmButtonColor: '#dc3545' });
            {% elif category == 'info' %}
            Swal.fire({ icon: 'info', title: 'Informasi', text: '{{ message }}', confirmButtonColor: '#0d6efd', timer: 2500, timerProgressBar: true });
            {% elif category == 'warning' %}
            Swal.fire({ icon: 'warning', title: 'Perhatian!', text: '{{ message }}', confirmButtonColor: '#ffc107' });
            {% endif %}
            {% endfor %}
            {% endif %}
            {% endwith %}
        });
    </script>
</body>
</html>
